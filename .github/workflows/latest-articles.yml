name: Latest articles

# Rebuilds the "Latest articles" list in README.md from Dev.to, Hashnode and Medium (published posts only).
# Runs daily, and on demand: `gh workflow run latest-articles.yml` right after publishing an article.
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/latest_articles.py
      - name: Commit if the list changed
        run: |
          if git diff --quiet README.md; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update latest articles" README.md
          git push
