<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Luis Eduardo G. Espindola, Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#102a22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3cb371"/>
      <stop offset="1" stop-color="#7ee2a8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="14" fill="url(#grid)"/>

  <!-- code-window motif, right side -->
  <g transform="translate(800 58)" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="15">
    <rect width="340" height="184" rx="10" fill="#0d1117" stroke="#30363d"/>
    <circle cx="20" cy="18" r="5" fill="#ff5f57"/><circle cx="38" cy="18" r="5" fill="#febc2e"/><circle cx="56" cy="18" r="5" fill="#28c840"/>
    <text x="20" y="58" fill="#8b949e">$ git push origin main</text>
    <text x="20" y="84" fill="#7ee2a8">✓ tests passed</text>
    <text x="20" y="110" fill="#7ee2a8">✓ build ok</text>
    <text x="20" y="136" fill="#7ee2a8">✓ deployed to production</text>
    <text x="20" y="162" fill="#c9d1d9">$ <tspan fill="#3cb371">▍</tspan></text>
  </g>

  <g font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif">
    <text x="64" y="112" font-size="46" font-weight="700" fill="#f0f6fc">Luis Eduardo G. Espindola</text>
    <rect x="64" y="132" width="88" height="4" rx="2" fill="url(#accent)"/>
    <text x="64" y="178" font-size="24" font-weight="600" fill="#7ee2a8">Full-Stack Developer · Python &amp; TypeScript</text>
    <text x="64" y="214" font-size="19" fill="#c9d1d9">FastAPI · Next.js · React · MongoDB · Postgres · Stripe</text>
    <text x="64" y="246" font-size="17" fill="#8b949e">Belgium · EN · PT · FR · ES · NL</text>
  </g>
</svg>
